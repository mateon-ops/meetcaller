<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeetCaller — Configuración</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <div class="card">
      <div class="row" style="margin-top:8px">
        <button id="googleSignIn">Iniciar sesión con Google</button>
        <button id="googleSignOut" class="secondary">Cerrar sesión</button>
      </div>
      <div id="authStatus" class="auth-status">Estado de autenticación</div>
      <label>Google Client ID
        <input id="clientId" type="text" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off" />
      </label>
      <label>Google Client Secret
        <input id="clientSecret" type="password" placeholder="**************" autocomplete="off" style="width:100%; border: 0.5px solid #e6e9ee; border-radius: 4px; height: 2rem; padding: 0.5rem; margin-top: 0.5rem;" />
      </label>
    </div>

    <div style="height:12px"></div>

    <div class="card">
      <div id="countdownBox" class="countdown-box">
        <span class="countdown-label">Próxima reunión</span>
        <span id="countdownValue" class="countdown-value">—</span>
        <span id="countdownEventName" class="countdown-event-name"></span>
      </div>

      <label>Minutos antes de avisar
        <input id="pollMinutes" type="number" min="0" value="1" />
      </label>
      <label>Archivo local del ringtone (MP3 / WAV / M4A)
        <input id="ringtoneFile" type="file" accept="audio/*,.mp3,.wav,.m4a" />
      </label>
      <label class="checkbox-label" style="margin-top:12px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="meetOnly" />
        <span>Solo avisar reuniones de Meet</span>
      </label>
      <div class="actions">
        <button id="save">Guardar</button>
        <button id="test" class="secondary">Ver eventos</button>
        <button id="simulateCall" class="secondary">Probar llamada</button>
      </div>

      <div class="events" id="events" style="display:none"></div>
    </div>
  </div>

  <script src="google-auth.js"></script>
  <script src="options.js"></script>
</body>

</html>
