<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MeetCaller Config</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px
    }

    label {
      display: block;
      margin-top: 10px
    }

    input[type=text] {
      width: 100%;
      padding: 8px
    }

    input[type=number] {
      width: 120px
    }

    button {
      margin-top: 12px;
      padding: 8px 12px
    }

    .events {
      margin-top: 16px
    }

    .event {
      padding: 8px;
      border-bottom: 1px solid #ddd
    }
  </style>
</head>

<body>
  <h2>MeetCaller — Configuración local</h2>
  <p>Introducí la <strong>Dirección privada iCal (.ics)</strong> desde Google Calendar y guarda.</p>
  <label>iCal URL
    <input id="icalUrl" type="text" placeholder="https://calendar.google.com/.../basic.ics" />
  </label>
  <label>Minutos antes de avisar
    <input id="pollMinutes" type="number" min="0" value="1" />
  </label>
  <div>
    <button id="save">Guardar</button>
    <button id="test">Ver eventos</button>
  </div>

  <div class="events" id="events"></div>

  <script src="app.js"></script>
</body>

</html>
